name: third-party
on: pull_request
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
      - run: echo done
  other-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: acme/shared
      - run: ls
  reuse:
    uses: acme/shared/.github/workflows/lint.yml@main
